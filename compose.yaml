services:
  app:
    build: microservicioAdult
    ports:
      - ${SPRING_PORT}:${SPRING_PORT}
    container_name: microservice-main
    networks:
      - microservice-network
    depends_on:
       postgres:
         condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOUCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOUCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}


  postgres:
    image: 'postgres:alpine'
    restart: unless-stopped
    container_name: postgres_microservicio
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - microservice-network
    healthcheck:
      test: ['CMD', 'pg_isready -U zennon']
      interval: 5s
      timeout: 20s
      retries: 3
    volumes:
      - pgdata:/data/postgres
networks:
  microservice-network:
    driver: bridge
volumes:
  pgdata: