services:


  adultservice:                          #Nombre
    build: microservicioAdult            #Donde docker buscara el dockerFile
    ports:
      - ${SPRING_PORT_ADULT}:${SPRING_PORT_ADULT}
    container_name: microserviceAdult    #Nombre del contenedor
    networks:
      - microservice-network
    depends_on:
       postgres:
         condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

  childservice:
    build: microservicioChild
    ports:
      - ${SPRING_PORT_CHILD}:8080
    container_name: microservicechild
    networks:
      - microservice-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_PORT: ${SPRING_PORT_CHILD}

  postgres:
    image: 'postgres:alpine'
    restart: unless-stopped
    container_name: postgres_microservicio
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - microservice-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 5s
      timeout: 20s
      retries: 3
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
networks:
  microservice-network:
    driver: bridge
volumes:
  pgdata: